:root{
  --bg:#070C18; --bg2:#0E1830; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
  --ink:#F1F4FB; --muted:#A3AEC6; --dim:#7884A0;
  --st:#4F8BFF; --mk:#2DD4BF; --fn:#F5B83D; --red:#FF6B6B; --green:#34D399; --amber:#F5B83D;
  --font:'Readex Pro','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;transform:translate(-50%,-50%);overflow:hidden;
  background:radial-gradient(1200px 700px at 85% -10%,#15244A 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#0F2A3A 0%,transparent 55%),linear-gradient(160deg,var(--bg2),var(--bg) 70%)}
/* الانتقال بين الشرائح: تلاشٍ هادئ فقط، بلا انزلاق ولا اهتزاز */
.slide{position:absolute;inset:0;padding:46px 80px 0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s .6s}
.slide.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.hd{display:flex;align-items:center;justify-content:space-between;height:40px;margin-bottom:14px}
.sec{font-size:18px;font-weight:500;padding:6px 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.03)}
.sec i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:9px;vertical-align:1px;background:var(--c,#8A8F98)}
h1{font-size:46px;line-height:1.22;margin:0;font-weight:700;letter-spacing:-.3px;max-width:1440px}
h1 em{font-style:normal;color:var(--c,var(--amber))}
h1 small{font-size:22px;color:var(--muted);font-weight:400;margin-right:12px}
/* منطقة المحتوى ثابتة الموضع في كل شريحة */
.body{position:absolute;left:80px;right:80px;top:172px;bottom:178px}
.body.tall{bottom:104px}
/* بطاقات — بلا حركة عند المرور */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 24px;position:relative;overflow:hidden}
.card .lbl{font-size:19px;color:var(--muted);font-weight:400;line-height:1.4}
.card .big{font-size:58px;font-weight:700;line-height:1.1;margin:6px 0 4px;letter-spacing:-1px}
.card .note{font-size:18px;color:var(--muted);line-height:1.5}
.up{color:var(--green)} .down{color:var(--red)} .amb{color:var(--amber)}
.hero .big{font-size:92px;color:var(--red)}
.pulse{animation:glow 3s ease-in-out infinite}
/* الشريط السفلي: الخلاصة أو سطر الربط + الحل */
.take{position:absolute;left:80px;right:80px;bottom:100px;min-height:64px;display:flex;align-items:center;gap:16px;padding:12px 24px;border-radius:16px;
  background:linear-gradient(90deg,rgba(245,184,61,.12),rgba(245,184,61,.03));border:1px solid rgba(245,184,61,.28);font-size:25px;font-weight:600;line-height:1.4}
.take .tx{flex:1}
.take.link{background:linear-gradient(90deg,rgba(79,139,255,.15),rgba(79,139,255,.03));border-color:color-mix(in srgb,var(--c) 45%,transparent);font-size:23px}
.take .tag{flex:none;font-size:16px;font-weight:700;color:#08101F;background:var(--c,var(--amber));border-radius:999px;padding:4px 14px}
.sol{flex:none;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;color:var(--green);border:1px solid rgba(52,211,153,.45);background:rgba(52,211,153,.08);border-radius:999px;padding:6px 14px;white-space:nowrap}
.sol b{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:9px;background:var(--green);color:#06221A;font-size:16px;padding:0 6px}
/* المصدر في أسفل كل شريحة */
.src{position:absolute;left:80px;right:80px;bottom:68px;font-size:15px;color:var(--dim);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src b{color:var(--muted);font-weight:500}
/* الشريط السفلي العام */
#bar{position:absolute;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 80px;z-index:5;border-top:1px solid rgba(255,255,255,.05);background:rgba(7,12,24,.55)}
#trk{display:flex;gap:8px;align-items:center}
#trk span{font-size:15px;color:var(--dim);padding:4px 12px;border-radius:999px;border:1px solid transparent;transition:color .4s,background .4s}
#trk span.on{color:var(--ink);border-color:var(--line);background:rgba(255,255,255,.06)}
#trk span.done{color:var(--muted)}
#trk em{color:var(--dim);font-style:normal;font-size:13px}
#cnt{display:flex;align-items:center;gap:14px;font-size:16px;color:var(--muted)}
#cnt .live{width:9px;height:9px;border-radius:50%;background:var(--green);animation:breathe 2.4s ease-in-out infinite}
#cnt img{height:28px;filter:brightness(0) invert(1);opacity:.5}
#prog{position:absolute;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--st),var(--mk),var(--fn));z-index:6;transition:width 1s linear}
/* الغلاف والنهاية */
.cover{display:flex;flex-direction:column;justify-content:center;padding:0 120px}
.cover .logos,.endp .logos{position:absolute;top:56px;right:120px;left:120px;display:flex;justify-content:space-between;align-items:center}
.pill{background:#fff;border-radius:18px;padding:10px 18px;display:flex;align-items:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.pill img{height:72px;display:block}
.cover .kick{font-size:22px;color:var(--mk);font-weight:500;margin-bottom:18px}
.cover h1{font-size:82px;line-height:1.15;margin:0 0 22px;max-width:1100px}
.cover h1 span{background:linear-gradient(90deg,#fff,#9CC0FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .sub{font-size:27px;color:var(--muted);max-width:1100px;line-height:1.55;margin-bottom:46px}
.cover .meta{display:flex;gap:40px;font-size:21px;color:var(--muted)}
.cover .meta b{display:block;color:var(--ink);font-weight:600;font-size:24px;margin-top:4px}
.rays{position:absolute;left:-300px;bottom:-300px;width:900px;height:900px;opacity:.09}
.endp{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.endp .ty{font-size:110px;font-weight:700;line-height:1.1;background:linear-gradient(90deg,#fff,#9CC0FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.endp .q{font-size:40px;color:var(--mk);margin-top:16px;font-weight:500}
.endp .who{font-size:22px;color:var(--muted);margin-top:56px;line-height:1.8}
.endp .who b{color:var(--ink);font-weight:600}
/* شبكات ورسوم */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:24px;height:100%}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
svg text{font-family:var(--font)}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 22px;position:relative;display:flex;flex-direction:column;min-height:0}
.chartbox>svg{flex:1;min-height:0}
.chartbox .cap{font-size:19px;color:var(--muted);margin-bottom:4px}
.chartbox .cap b{color:var(--ink);font-weight:600}
/* حالات الدخول — مرة واحدة فقط */
.bar-r{transform-origin:bottom;transform:scaleY(0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.bar-h{transform-box:fill-box;transform-origin:right;transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.on .bar-r,.on .bar-h{transform:none}
.ln{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.6s ease .3s}
.on .ln{stroke-dashoffset:0}
.mv{opacity:0;transition:opacity .6s ease 1.8s}
.on .mv{opacity:1}
.fade{opacity:0;transform:translateY(12px);transition:opacity .6s,transform .6s}
.on .fade{opacity:1;transform:none}
/* مشكلة البحث */
.problem .box{position:relative;padding:28px 36px;border-radius:24px;background:linear-gradient(135deg,rgba(79,139,255,.14),rgba(45,212,191,.06));border:1px solid rgba(79,139,255,.35);font-size:34px;line-height:1.62;font-weight:500}
.problem .box .w{opacity:.12;transition:opacity .5s}
.problem .box .w.lit{opacity:1}
.problem .box .w.hot{color:var(--red);font-weight:700}
.verdict{display:flex;align-items:center;gap:16px;margin-top:20px;padding:16px 24px;border-radius:18px;border:1px solid rgba(245,184,61,.4);background:rgba(245,184,61,.08);font-size:27px;font-weight:600}
.verdict .k{flex:none;font-size:17px;font-weight:700;color:#08101F;background:var(--amber);border-radius:999px;padding:4px 14px}
.dimtag{display:inline-block;font-size:.8em;font-weight:700;padding:1px 12px;border-radius:999px;color:#08101F}
.problem .q{margin:18px 0 14px;font-size:25px;color:var(--muted);font-weight:500}
.problem .q b{color:var(--ink)}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.goal{display:flex;gap:14px;align-items:center;padding:14px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:22px}
.goal b{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(79,139,255,.18);color:#9CC0FF;font-size:20px}
/* كيف عرفنا */
.tests{display:flex;flex-direction:column;gap:10px}
.test{display:grid;grid-template-columns:54px 400px 1fr 150px;gap:18px;align-items:center;padding:9px 20px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.test .n{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:24px;font-weight:700;background:rgba(255,255,255,.07);color:var(--muted)}
.test .q{font-size:25px;font-weight:600}
.test .ev{font-size:22px;color:#CFD8EA;line-height:1.4}
.test .ev small{display:block;font-size:14px;color:var(--dim);margin-top:4px}
.test .x{justify-self:end;display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;color:var(--red);border:1px solid rgba(255,107,107,.45);background:rgba(255,107,107,.08);border-radius:999px;padding:6px 14px}
.concl{margin-top:12px;display:flex;align-items:center;gap:18px;padding:12px 24px;border-radius:20px;border:1px solid rgba(79,139,255,.5);background:linear-gradient(90deg,rgba(79,139,255,.2),rgba(79,139,255,.04));font-size:30px;font-weight:700}
.concl .ok{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--st);color:#fff;font-size:28px}
/* المزيج التسويقي */
.mix{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;height:100%}
.p4{display:flex;flex-direction:column;padding:16px 22px;border-radius:20px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--mk);min-height:0}
.p4 .h{display:flex;align-items:center;gap:12px}
.p4 .h .nm{font-size:25px;font-weight:700;color:var(--mk)}
.p4 .h .sol{margin-right:auto}
.p4 .big{font-size:40px;font-weight:700;margin:6px 0 2px;line-height:1.15}
.p4 .fact{font-size:18px;color:var(--muted);line-height:1.45}
.p4 .gap{margin-top:auto;font-size:19px;font-weight:500;color:#FFC2C2;padding-top:8px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.p4 .gap:before{content:'✕';color:var(--red);font-weight:700}
/* بورتر */
.porter{display:flex;flex-direction:column;gap:8px}
.pf{display:grid;grid-template-columns:210px 120px 1fr;gap:14px;align-items:center;font-size:19px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.03)}
.pf .lv{font-weight:700;text-align:center;border-radius:999px;padding:3px 0;font-size:16px}
.pf .lv.hi{color:#FFC2C2;background:rgba(255,107,107,.16)}
.pf .lv.lo{color:#B7F5DC;background:rgba(52,211,153,.14)}
.pf .why{color:var(--muted);font-size:17px}
/* التوصيات */
.sent{font-size:21px;line-height:1.6;color:#CFD8EA;padding:12px 20px;border-right:4px solid var(--st);background:rgba(79,139,255,.07);border-radius:12px}
.tier{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:stretch;margin-top:12px}
.tier .tk{display:flex;flex-direction:column;justify-content:center;padding:10px 16px;border-radius:16px;border:1px solid var(--line);border-right:4px solid var(--c)}
.tier .tk b{font-size:24px;color:var(--c)} .tier .tk span{font-size:15px;color:var(--muted);line-height:1.35;margin-top:2px}
.tier .rs{display:grid;gap:12px}
.rec{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.rec .n{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:23px;font-weight:700;color:#08101F;background:var(--c)}
.rec .t{font-size:21px;font-weight:600;line-height:1.3}
.rec .y{font-size:16px;color:var(--muted);margin-top:3px}
.rec .p{display:inline-block;font-size:14px;font-weight:700;color:var(--mk);border:1px solid rgba(45,212,191,.45);border-radius:999px;padding:0 10px;margin-left:8px;vertical-align:2px}
/* بطاقة الأداء */
.bsc{display:flex;flex-direction:column;gap:12px}
.bsc .r{display:grid;grid-template-columns:200px 1.05fr 1.15fr 1.15fr 150px;gap:18px;align-items:center;padding:16px 22px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:21px;line-height:1.4}
.bsc .r.h{background:none;border:none;padding:0 22px;font-size:16px;color:var(--dim)}
.bsc .k{font-weight:700;color:var(--amber);font-size:24px}
.bsc .t{color:var(--amber);font-weight:600}
.bsc .rn{display:flex;gap:6px;justify-content:flex-start}
.bsc .rn b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font-size:17px;background:rgba(52,211,153,.16);color:var(--green)}
/* ملاحظات المقدّم */
#notes{position:absolute;left:24px;right:24px;bottom:66px;max-height:56%;overflow:auto;background:rgba(5,9,20,.97);border:1px solid var(--line);border-radius:18px;padding:20px 26px;font-size:21px;line-height:1.75;z-index:20;display:none}
#notes.show{display:block}
#notes .h{display:flex;justify-content:space-between;color:var(--muted);font-size:16px;margin-bottom:8px}
#notes .nx{color:var(--mk);margin-top:8px}
#notes .t1{color:var(--amber);font-weight:700}
#black{position:absolute;inset:0;background:#000;z-index:30;display:none}
#help{position:absolute;inset:auto 24px 66px auto;z-index:21;background:rgba(5,9,20,.97);border:1px solid var(--line);border-radius:16px;padding:16px 22px;font-size:17px;line-height:1.9;display:none;color:var(--muted)}
#help.show{display:block}
#help b{color:var(--ink)}
.nb{unicode-bidi:isolate}

/* شرائح الإضافة */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tiles .card{padding:16px 22px}
.tiles .big{font-size:46px;margin:0 0 4px}
.ipo{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.ipo>div{padding:14px 20px;border-radius:18px;border:1px solid rgba(79,139,255,.4);background:rgba(79,139,255,.08)}
.ipo b{display:block;font-size:24px;color:#9CC0FF;margin-bottom:4px}
.ipo span{font-size:19px;line-height:1.45;color:#DCE4F5}
.blk{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:start;padding:12px 18px;border-radius:14px;background:rgba(255,255,255,.03);font-size:19px;line-height:1.5}
.blk b{color:var(--amber);font-size:21px}
.srow{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.4}
.srow span:last-child{color:var(--muted)}
.lim{display:grid;grid-template-columns:44px 1fr 40px 1fr;gap:14px;align-items:center;padding:11px 20px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;line-height:1.4}
.lim .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--muted);font-weight:700}
.lim .ar{color:var(--dim);text-align:center;font-size:24px}
.lim .ok{color:#B7F5DC}
.swq{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swq>div{padding:12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c)}
.swq b{font-size:22px;color:var(--c)}
.swq ul{margin:4px 0 0;padding:0 18px 0 0;font-size:17px;line-height:1.55;color:#DCE4F5}
.tw{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:19px;line-height:1.4}
.tw .k{flex:none;font-weight:700;font-size:18px;color:#08101F;background:var(--amber);border-radius:10px;padding:4px 10px;direction:ltr}
.tw .sol{margin-right:auto}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.step{padding:18px 20px;border-radius:18px;background:var(--card);border:1px solid var(--line);position:relative}
.step .k{font-size:18px;color:var(--muted)}
.step .h{font-size:28px;font-weight:700;margin:4px 0 8px}
.step .v{font-size:19px;line-height:1.55;color:#DCE4F5}
.step.up{border-top:4px solid var(--green)} .step.down{border-top:4px solid var(--red)} .step.mid{border-top:4px solid var(--st)}

.idg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.idc{padding:18px 24px;border-radius:20px;background:var(--card);border:1px solid var(--line);border-right:4px solid var(--c)}
.idc b{display:block;font-size:24px;color:var(--c);margin-bottom:6px}
.idc span{font-size:22px;line-height:1.55;color:#E3E9F6}
.define{margin-top:16px;padding:12px 20px;border-radius:14px;border:1px dashed rgba(255,255,255,.18);font-size:19px;color:#CFD8EA}
.define b{color:var(--mk)}
.proofs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.proofs>div{padding:12px 18px;border-radius:16px;background:rgba(79,139,255,.07);border:1px solid rgba(79,139,255,.3);font-size:18px;line-height:1.55;color:#DCE4F5}
.proofs b{display:block;font-size:19px;color:#9CC0FF;margin-bottom:2px}
.smap{display:flex;flex-direction:column;gap:0}
.sm{display:grid;grid-template-columns:170px 1.1fr 1.3fr 1.2fr 110px;gap:16px;align-items:center;padding:12px 20px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-right:4px solid var(--c);font-size:19px;line-height:1.4}
.sm .k{font-size:23px;font-weight:700;color:var(--c)}
.sm .ft{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sm .ft .a{font-size:28px;font-weight:700;color:var(--red)} .sm .ft .b{font-size:28px;font-weight:700;color:var(--green)}
.sm .ft small{font-size:15px;color:var(--muted);width:100%}
.sm .k2{font-size:16px;color:var(--muted)}
.sm .rn{display:flex;gap:6px}
.sm .rn b{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;font-size:16px;background:rgba(52,211,153,.16);color:var(--green)}
.smar{text-align:center;color:var(--dim);font-size:15px;line-height:1;padding:3px 0}
@keyframes glow{0%,100%{text-shadow:0 0 0 rgba(255,107,107,0)}50%{text-shadow:0 0 26px rgba(255,107,107,.75)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

ديد ذهب إلى ملاك آخرين، والشركة لم تلحق به.", "link": "زادت طاقتها، وبقيت تبيع لنفس العملاء في نفس المنطقة… والطلب الجديد ذهب إلى القطاع الخاص.", "sol": [1], "src": "Corder (2026)، AGBI: بيانات منصة Scavo للهيئة السعودية للمقاولين · القوائم الأولية للنصف الأول 2026 (2026ج) · القوائم المدققة — جدول (4) والشكل (4)", "talk": "العائد على رأس المال، أي كم تربح الشركة من كل 100 ريال مستثمرة: 26.8 ريالًا في 2022، ثم 14.4 في 2023؛ فقد نصفه تقريبًا في سنة. والخط الرمادي دوران الأصول، ثابت؛ فالمشكلة ليست في تشغيل المعدات بل في الهامش. · وفي النصف الأول 2026 زادت قيمة المشاريع الجديدة المُرساة على المقاولين 82%، بينما نزلت إيرادات الشركة 12.5%. · وأين ذهب الطلب؟ حصة صندوق الاستثمارات العامة من المشاريع المُرساة نزلت من 65% إلى أقل من 5%؛ فالمشاريع الجديدة صارت لملاك آخرين، أغلبهم من القطاع الخاص. · السوق نما، والشركة انكمشت، والمموّل الأكبر انسحب: الطلب انتقل، والشركة لم تنتقل معه. والحل التوصية الأولى.", "next": "فكم كلّفها ذلك ماليًا؟", "note2026": "العائد سنوي حتى 2025؛ و2026 لم تكتمل، فأرقامها في البطاقات"}, {"id": "fn1", "title": "أين ذهب الهامش؟", "sec": "البعد المالي", "dim": "fn", "seconds": 55, "kind": "margin", "annual": {"labels": ["2021", "2022", "2023", "2024", "2025"], "vals": [32.5, 27.8, 19.5, 17.8, 22.2]}, "quarters": {"labels": ["ر4 2025", "ر1 2026", "ر2 2026"], "vals": [23.4, 14.9, 12.5]}, "drop": {"from": 27.8, "to": 19.5, "total": 8.29, "items": [["المواد ومستلزمات التشغيل", 4.42, "مواد أغلى لم تُحمَّل على السعر"], ["استهلاك المعدات والأصول", 2.32, "أصول جديدة من التوسّع"], ["بنود أخرى", 1.55, ""]]}, "take": "بندان يفسّران 6.7 من 8.3 نقاط: مواد أغلى، وأصول جديدة تُستهلك.", "sol": [2], "src": "القوائم المالية الموحّدة 2021–2025 · أرقام (2026أ) للأرباع · إيضاح تكلفة الإيرادات في قوائم 2023 (2026د) · احتساب الباحث — الشكل (5)", "talk": "ماليًا: أين ذهب الهامش؟ · الخط يبيّن المسار: 32.5% في 2021، ثم 19.5% في 2023، وأدناه 17.8% في 2024، وتحسّن إلى 22.2% في 2025، ثم عاد ينهار في 2026 ربعًا بعد ربع حتى 12.5%. · وأكبر سقطة كانت 2023: 8.3 نقاط في سنة واحدة. فككت تك const C = {st:'#4F8BFF', mk:'#2DD4BF', fn:'#F5B83D', red:'#FF6B6B', green:'#34D399', muted:'#A3AEC6', dim:'#7884A0', ink:'#F1F4FB', amber:'#F5B83D', gray:'#9AA6BF', line:'rgba(255,255,255,.10)'};
const DIMC = {mk:C.mk, st:C.st, fn:C.fn, all:C.amber};
const DIMN = {mk:'تسويقي', st:'استراتيجي', fn:'مالي'};
const ALL = D.slides.concat(D.backup.map(b => Object.assign({backup:true, sec:'احتياطي', seconds:0}, b)));
const MAIN = D.slides.length;
const TOTAL = D.slides.reduce((a, s) => a + (s.seconds || 0), 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NUMRE = /[+\-‑−]?\d[\d,.]*%?/g;
const rt = s => esc(s).replace(/\([A-Za-z][^()]*\)|[+\-‑−]?\d[\d,.]*%?/g, m => `<bdi dir="ltr">${m}</bdi>`);
const nb = (v, unit) => `<bdi dir="ltr" class="nb">${v}${unit||''}</bdi>`;
const fmt = (v, dec) => { const s = Math.abs(v).toFixed(dec || 0); const p = s.split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (v < 0 ? '‑' : '') + p.join('.'); };

/* ——— أدوات SVG ——— */
function svg(w, h){ return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" direction="ltr">`; }
const dpath = pts => pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
function pathLen(pts){ let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); return Math.ceil(L) + 2; }
function line(pts, color, w){ return `<path class="ln" d="${dpath(pts)}" fill="none" stroke="${color}" stroke-width="${w||4}" stroke-linecap="round" stroke-linejoin="round" style="--len:${pathLen(pts)}"/>`; }
/* نقطة تتحرك ببطء على كل خط — تظهر بعد اكتمال رسمه */
function mover(pts, color, dur){ return `<g class="mv"><circle r="13" fill="${color}" opacity=".18"/><circle r="6.5" fill="${color}"/><animateMotion dur="${dur||7}s" repeatCount="indefinite" path="${dpath(pts)}"/></g>`; }
function dot(x, y, color, r){ return `<circle cx="${x}" cy="${y}" r="${r||7}" fill="#0B1328" stroke="${color}" stroke-width="3"/>`; }
function txt(x, y, s, o){ o = o || {}; const ar = /[؀-ۿ]/.test(String(s)); if (ar && o.a !== undefined && o.a !== 'middle') o = Object.assign({}, o, {a: o.a === 'start' ? 'end' : 'start'});
  const body = ar ? esc(s).replace(NUMRE, m => `<tspan style="unicode-bidi:isolate;direction:ltr">${m}</tspan>`) : esc(s);
  return `<text x="${x}" y="${y}" fill="${o.c||C.muted}" font-size="${o.s||18}" font-weight="${o.w||400}" text-anchor="${o.a||'middle'}" ${ar ? 'style="direction:rtl;unicode-bidi:plaintext"' : ''}>${body}</text>`; }
function legend(x, y, items){ let g = `<g transform="translate(${x},${y})">`, off = 0; items.forEach(it => { g += `<rect x="${off}" width="16" height="16" rx="8" fill="${it[1]}"/>` + txt(off + 24, 13, it[0], {a:'start', s:16}); off += 24 + it[0].length * 9 + 34; }); return g + '</g>'; }

/* ——— أجزاء مشتركة ——— */
const B = {};
const hd = s => `<div class="hd"><span class="sec" style="--c:${DIMC[s.dim]||C.gray}"><i></i>${esc(s.backup ? 'احتياطي للأسئلة' : s.sec)}</span></div>`;
const src = s => s.src ? `<div class="src"><b>المصدر:</b> ${rt(s.src)}</div>` : '';
const sol = ns => ns && ns.length ? `<span class="sol">الحل ← التوصية ${ns.map(n => `<b>${n}</b>`).join(' ')}</span>` : '';
const take = s => `<div class="take"><span class="tx">${rt(s.take)}</span>${sol(s.sol)}</div>`;
const link = (s, c) => `<div class="take link" style="--c:${c}"><span class="tag">سطر الربط</span><span class="tx">${rt(s.link)}</span>${sol(s.sol)}</div>`;

B.cover = s => {
  const m = D.meta;
  let rays = `<svg class="rays" viewBox="-100 -100 200 200">`;
  for (let i = 0; i < 18; i++) rays += `<rect x="-1.4" y="-96" width="2.8" height="78" fill="${i % 3 ? '#8A8F98' : '#4F8BFF'}" transform="rotate(${i * 10})" rx="1.4"/>`;
  rays += `</svg>`;
  return `<div class="slide cover">${rays}
    <div class="logos"><div class="pill"><img src="${LOGO.rashed}" alt="شعار الشركة"></div><div class="pill"><img src="${LOGO.college}" alt="شعار الكلية"></div></div>
    <div class="kick fade">مشروع التخرج · ${esc(m.program)}</div>
    <h1 class="fade" style="transition-delay:.1s"><span>${esc(m.title)}</span></h1>
    <div class="sub fade" style="transition-delay:.2s">${rt(m.subtitle)}</div>
    <div class="meta fade" style="transition-delay:.35s"><div>إعداد<b>${esc(m.student)} · ${esc(m.sid)}</b></div><div>إشراف<b>${esc(m.supervisor)}</b></div><div>التاريخ<b>${esc(m.date)}</b></div></div>
  </div>`;
};

B.paradox = s => {
  const cards = s.kpis.map((x, i) => {
    const u = x.unit === '%' ? '%' : '';
    const big = x.from !== undefined
      ? `${nb(`<span class="cu" data-to="${x.from}" data-dec="${x.dec||0}">${fmt(x.from, x.dec)}</span>`, u)}<span style="font-size:.5em;color:var(--dim)"> ← </span><span class="${x.tone}">${nb(`<span class="cu" data-to="${x.to}" data-dec="${x.dec||0}">0</span>`, u)}</span>${x.unit && x.unit !== '%' ? `<span style="font-size:.38em;color:var(--muted);font-weight:500">${esc(x.unit)}</span>` : ''}`
      : `<span class="pulse">${nb(`<span class="cu" data-to="${x.to}" data-dec="0">0</span>`, x.unit)}</span>`;
    return `<div class="card fade ${x.hero ? 'hero' : ''}" style="transition-delay:${i*0.12}s"><div class="lbl">${rt(x.label)}</div><div class="big">${big}</div><div class="note">${rt(x.delta)}</div></div>`;
  }).join('');
  const c = s.chart, W = 1440, H = 290, L = 60, R = 1380, T = 40, Bm = 252;
  const xs = c.years.map((_, i) => L + 90 + i * ((R - L - 180) / (c.years.length - 1)));
  const mx = 800, bw = 120;
  let g = svg(W, H);
  c.rev.forEach((v, i) => { const h = (v / mx) * 105; g += `<rect class="bar-r" x="${xs[i]-bw/2}" y="${Bm-h}" width="${bw}" height="${h}" rx="10" fill="rgba(79,139,255,.28)" style="transition-delay:${i*90}ms"/>`;
    g += txt(xs[i], Bm - h + 26, v, {c:'#9CC0FF', s:19, w:600}); g += txt(xs[i], Bm + 30, c.years[i], {s:18}); });
  const mpts = c.margin.map((v, i) => [xs[i], (Bm - 128) - (v - 12) / (36 - 12) * (Bm - 128 - T - 26)]);

B.margin = s => {
  const a = s.annual, q = s.quarters, W = 820, H = 470, L = 50, R = 790, T = 70, Bm = 400;
  const n = a.labels.length + q.labels.length, step = (R - L - 60) / (n - 1) ;
  const X = i => L + 30 + i * step + (i >= a.labels.length ? 26 : 0);
  const Y = v => Bm - (v - 8) / (36 - 8) * (Bm - T);
  let g = svg(W, H);
  const xd = (X(a.labels.length - 1) + X(a.labels.length)) / 2;
  g += `<rect x="${xd}" y="${T - 30}" width="${R - xd}" height="${Bm - T + 50}" rx="12" fill="rgba(255,107,107,.06)"/>`;
  g += txt((L + xd) / 2, T - 8, 'سنوي', {s:17, c:C.dim}) + txt((xd + R) / 2, T - 8, 'ربعي · بعد الإدراج', {s:17, c:'#FFB0B0'});
  const ap = a.vals.map((v, i) => [X(i), Y(v)]), qp = q.vals.map((v, i) => [X(a.labels.length + i), Y(v)]);
  g += line(ap, C.amber, 5) + line(qp, C.red, 5);
  const lab = (pts, vals, i, c, sz) => { const v = vals[i], pv = vals[i-1], nv = vals[i+1], p = pts[i];
    if (pv !== undefined && (nv === undefined ? pv > v : nv > v)) return txt(p[0], p[1] + 34, v + '%', {c, s:sz, w:700});
    if (pv !== undefined && pv > v) return txt(p[0] + 12, p[1] - 12, v + '%', {c, s:sz, w:700, a:'start'});
    return txt(p[0], p[1] - 18, v + '%', {c, s:sz, w:700}); };
  ap.forEach((p, i) => g += dot(p[0], p[1], C.amber) + lab(ap, a.vals, i, C.amber, 20) + txt(p[0], Bm + 36, a.labels[i], {s:17}));
  qp.forEach((p, i) => g += dot(p[0], p[1], C.red) + lab(qp, q.vals, i, C.red, 22) + txt(p[0], Bm + 36, q.labels[i], {s:16}));
  g += mover(ap, C.amber, 7) + mover(qp, C.red, 5);
  g += `</svg>`;
  const d = s.drop, mxv = 4.42;

      ${it[2] ? `<div style="font-size:16px;color:var(--muted);margin-top:4px">${esc(it[2])}</div>` : ''}</div>`).join('');
  return `<div class="slide">${hd(s)}<h1>أين ذهب <em style="--c:${C.fn}">الهامش</em>؟</h1>
    <div class="body"><div class="g2" style="grid-template-columns:1.1fr 1fr"><div class="chartbox fade"><div class="cap">الهامش الإجمالي: سنويًا ثم ربعيًا</div>${g}</div>
    <div class="chartbox fade" style="transition-delay:.2s"><div class="cap">أين ذهبت <b>${nb(d.total.toFixed(1))} نقاط</b> في 2023؟ (الهامش ${nb(d.from + '%')} ← ${nb(d.to + '%')})</div>

};

    </div></div></div>${link(s, C.fn)}${src(s)}</div>`;
};

B.recs = s => {
  const tiers = s.tiers.map((t, ti) => {
    const c = DIMC[t.dim];
    const rs = t.recs.map((r, i) => `<div class="rec fade" style="--c:${c};transition-delay:${0.3 + ti*0.35 + i*0.12}s"><div class="n">${r.n}</div><div><div class="t">${r.p ? `<span class="p">${esc(r.p)}</span>` : ''}${rt(r.rec)}</div><div class="y">لأن: ${rt(r.why)}</div></div></div>`).join('');
    return `<div class="tier" style="--c:${c}"><div class="tk fade" style="transition-delay:${0.2 + ti*0.35}s"><b>${esc(t.k)}</b><span>${esc(t.sub)}</span></div><div class="rs" style="grid-template-columns:${t.recs.length > 1 ? '1fr 1fr' : '1fr'}">${rs}</div></div>`;
  }).join('');
  return `<div class="slide">${hd(s)}<h1>المشكلة… و<em style="--c:${C.amber}">ست توصيات</em> تحلّها</h1>
    <div class="body tall"><div class="sent fade">${rt(s.sentence)} <b style="color:var(--amber)">${rt(s.verdict)}</b></div>${tiers}</div>${src(s)}</div>`;
};

B.bsc = s => {
  if (s.map) {
    const col = {'المالي': C.amber, 'العملاء': C.mk, 'العمليات': C.st, 'التعلم والنمو': C.green};
    const rows = s.map.map((r, i) => `${i ? '<div class="smar">▲ تؤدي إلى</div>' : ''}<div class="sm fade" style="--c:${col[r.k]};transition-delay:${0.9 - i*0.2}s">
      <span class="k">${esc(r.k)}</span><span>${rt(r.goal)}</span>
      <span>${rt(r.kpi)}${r.kpi2 ? `<div class="k2">${rt(r.kpi2)}</div>` : ''}</span>
      <span class="ft"><span class="a">${rt(r.from)}</span><span style="color:var(--dim)">←</span><span class="b">${rt(r.to)}</span>${r.when ? `<small>${rt(r.when)}</small>` : ''}</span>
      <span class="rn">${r.recs.map(n => `<b>${n}</b>`).join('')}</span></div>`).join('');
    return `<div class="slide">${hd(s)}<h1>كيف نعرف أن الحل <em style="--c:${C.green}">نجح</em>؟ <small>بطاقة الأداء المتوازن: تُقرأ من الأسفل (السبب) إلى الأعلى (النتيجة)</small></h1>
      <div class="body tall"><div style="display:grid;grid-template-columns:170px 1.1fr 1.3fr 1.2fr 110px;gap:16px;padding:0 20px 6px;font-size:15px;color:var(--dim)"><span>المنظور</span><span>الهدف</span><span>المؤشر</span><span>من ← إلى</span><span>التوصيات</span></div><div class="smap">${rows}</div></div>${src(s)}</div>`;
  }
  const rows = s.rows.map((r, i) => `<div class="r fade" style="transition-delay:${0.15 + i*0.15}s"><span class="k">${esc(r.k)}</span><span>${rt(r.goal)}</span><span style="color:#CFD8EA">${rt(r.kpi)}</span><span class="t">${rt(r.target)}</span><span class="rn">${r.recs.map(n => `<b>${n}</b>`).join('')}</span></div>`).join('');
  return `<div class="slide">${hd(s)}<h1>كيف نعرف أن الحل <em style="--c:${C.green}">نجح</em>؟ <small>بطاقة الأداء المتوازن</small></h1>
    <div class="body tall"><div class="bsc"><div class="r h"><span>المنظور</span><span>الهدف</span><span>المؤشر</span><span>المستهدف</span><span>يقيس التوصيات</span></div>${rows}</div></div>${src(s)}</div>`;
};

B.end = s => {
  const m = D.meta;
  return `<div class="slide endp"><div class="logos"><div class="pill"><img src="${LOGO.rashed}" alt="شعار الشركة"></div><div class="pill"><img src="${LOGO.college}" alt="شعار الكلية"></div></div>
    <div class="ty fade">شكرًا لإصغائكم</div><div class="q fade" style="transition-delay:.25s">وأسعد بأسئلتكم</div>
    <div class="who fade" style="transition-delay:.45s"><b>${esc(m.student)}</b> · ${esc(m.sid)}<br>إشراف ${esc(m.supervisor)} · ${esc(m.program)}</div></div>`;
};


B.company = s => {
  const tiles = s.tiles.map((x, i) => `<div class="card fade" style="transition-delay:${i*0.08}s"><div class="big">${rt(x.big)}</div><div class="lbl">${rt(x.label)}</div></div>`).join('');
  const ipo = s.ipo.map((x, i) => `<div class="fade" style="transition-delay:${0.6 + i*0.15}s"><b>${rt(x.k)}</b><span>${rt(x.v)}</span></div>`).join('');
  return `<div class="slide">${hd(s)}<h1>من هي الشركة؟ <em style="--c:${C.st}">أكبر منتج للبحص</em> في المملكة</h1>
    <div class="body"><div class="tiles">${tiles}</div><div class="ipo">${ipo}</div>${s.define ? `<div class="define fade" style="transition-delay:1s"><b>ما هو البحص؟</b> ${rt(s.define)}</div>` : ''}</div>${take(s)}${src(s)}</div>`;
};
B.identity = s => {
  const col = [C.st, C.mk, C.amber, C.green];
  const it = s.items.map((x, i) => `<div class="idc fade" style="--c:${col[i]};transition-delay:${i*0.12}s"><b>${esc(x[0])}</b><span>${rt(x[1])}</span></div>`).join('');
  return `<div class="slide">${hd(s)}<h1>${esc(s.title)} <small>باختصار</small></h1>
    <div class="body"><div class="idg">${it}</div></div>${take(s)}${src(s)}</div>`;
};
/* ——— الشرائح الاحتياطية ——— */
B.method = s => {
  const bl = s.blocks.map((b, i) => `<div class="blk fade" style="transition-delay:${i*0.1}s"><b>${esc(b[0])}</b><span>${rt(b[1])}</span></div>`).join('');
  const sr = s.sources.map(r => `<div class="srow"><span>${rt(r[0])}</span><span>${rt(r[1])}</span></div>`).join('');
  return `<div class="slide">${hd(s)}<h1>${esc(s.title)} <small>دراسة حالة وثائقية</small></h1>
    <div class="body"><div class="g2" style="grid-template-columns:1fr 1fr"><div class="col" style="gap:12px">${bl}</div>
    <div class="chartbox fade" style="transition-delay:.2s"><div class="cap"><b>مصادر البيانات</b> · وما يوفّره كل مصدر</div>${sr}</div></div></div>${take(s)}${src(s)}</div>`;
};
B.limits = s => {
  const rows = s.rows.map((r, i) => `<div class="lim fade" style="transition-delay:${i*0.08}s"><span class="n">${i+1}</span><span>${rt(r[0])}</span><span class="ar">←</span><span class="ok">${rt(r[1])}</span></div>`).join('');
  return `<div class="slide">${hd(s)}<h1>${esc(s.title)}</h1>
    <div class="body tall"><div style="display:grid;grid-template-columns:44px 1fr 40px 1fr;gap:14px;padding:0 20px 8px;font-size:16px;color:var(--dim)"><span></span><span>الحد</span><span></span><span>كيف تعاملت معه</span></div>
    <div style="display:flex;flex-direction:column;gap:10px">${rows}</div></div>${src(s)}</div>`;
};
B.swot = s => {
  const q = s.q.map((x, i) => `<div class="fade" style="--c:${C[x[1]]};transition-delay:${i*0.1}s"><b>${esc(x[0])}</b><ul>${x[2].map(li => `<li>${rt(li)}</li>`).join('')}</ul></div>`).join('');
  const tw = s.tows.map((x, i) => `<div class="tw fade" style="transition-delay:${0.5 + i*0.12}s"><span class="k">${esc(x[0])}</span><span>${rt(x[1])}</span>${sol(x[2])}</div>`).join('');
  return `<div class="slide">${hd(s)}<h1>${esc(s.title)} <small>SWOT ثم TOWS</small></h1>
    <div class="body tall"><div class="g2" style="grid-template-columns:1.25fr 1fr"><div class="swq">${q}</div>
    <div class="col" style="gap:12px"><div style="font-size:19px;color:var(--muted)"><b style="color:var(--ink)">TOWS</b>: كل استراتيجية تقابل توصية في الدراسة</div>${tw}</div></div></div>${src(s)}</div>`;
};
B.value = s => {
  const p = s.pe;
  const cards = s.cards.map((c, i) => `<div class="card fade" style="transition-delay:${0.4 + i*0.15}s"><div class="big" style="font-size:52px">${rt(c.big)}</div><div class="lbl" style="color:var(--ink)">${rt(c.label)}</div><div class="note">${rt(c.note)}</div></div>`).join('');
  return `<div class="slide">${hd(s)}<h1>${esc(s.title)}</h1>
    <div class="body"><div class="g2" style="grid-template-columns:1.1fr 1fr"><div class="card fade" style="display:flex;flex-direction:column;justify-content:center;gap:18px">
      <div class="lbl">مكرر الربحية: كم يدفع المستثمر مقابل كل ريال ربح</div>
      <div style="display:flex;align-items:flex-end;gap:28px"><div><div class="big down" style="font-size:84px">${rt(p.a)}</div><div class="note">${esc(p.al)}</div></div>
        <div style="font-size:30px;color:var(--dim);padding-bottom:40px">مقابل</div><div><div class="big" style="font-size:84px">${rt(p.b)}</div><div class="note">${esc(p.bl)}</div></div></div>
      <div style="font-size:26px;font-weight:600">خصم تقييم يقارب <span class="down">${rt(p.d)}</span></div></div>
    <div class="col">${cards}</div></div></div>${take(s)}${src(s)}</div>`;
};
B.ipo = s => {
  const st = s.steps.map((x, i) => `<div class="step fade ${x.tone || 'mid'}" style="transition-delay:${i*0.25}s"><div class="k">${rt(x.k)}</div><div class="h ${x.tone}">${esc(x.h)}</div><div class="v">${rt(x.v)}</div></div>`).join('');
  return `<div class="slide">${hd(s)}<h1>${esc(s.title)}</h1>
    <div class="body"><div class="steps" style="margin-top:40px">${st}</div>
    <div class="card fade" style="margin-top:28px;transition-delay:1.1s;font-size:21px;line-height:1.6;color:#DCE4F5">${rt(s.talk)}</div></div>${take(s)}${src(s)}</div>`;
};

B.loop = s => {
  const cx = 720, cy = 300, R0 = 225, col = [C.st, C.mk, C.fn], ang = [-90, 30, 150];
  const P = a => [cx + R0 * Math.cos(a * Math.PI / 180), cy + R0 * Math.sin(a * Math.PI / 180)];
  let g = svg(1440, 600) + `<defs>${col.map((c, i) => `<marker id="ah${i}" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="14" refY="11" orient="auto"><path d="M0 0L22 11L0 22z" fill="${c}"/></marker>`).join('')}</defs>`;
  g += `<circle cx="${cx}" cy="${cy}" r="${R0}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="2"/>`;
  for (let i = 0; i < 3; i++) {
    const a0 = ang[i] + 38, a1 = ang[i] + 80, p0 = P(a0), p1 = P(a1);
    g += `<path d="M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A${R0} ${R0} 0 0 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}" fill="none" stroke="${col[i]}" stroke-width="5" marker-end="url(#ah${i})"/>`;
    const am = (ang[i] + 60) * Math.PI / 180, ca = Math.cos(am), lx = cx + (R0 + 34) * ca, ly = cy + (R0 + 34) * Math.sin(am) + (Math.abs(ca) < .3 ? 30 : 0);
    g += txt(lx, ly, s.arrows[i], {s:22, c:C.ink, w:500, a: ca > .3 ? 'start' : (ca < -.3 ? 'end' : 'middle')});
  }
  s.nodes.forEach((nd, i) => { const p = P(ang[i]);
    g += `<rect x="${p[0]-150}" y="${p[1]-45}" width="300" height="90" rx="20" fill="#0E1830" stroke="${col[i]}" stroke-width="3"/>` + txt(p[0], p[1] - 8, nd[0], {s:26, w:700, c:col[i]}) + txt(p[0], p[1] + 26, nd[1], {s:19, c:C.ink}); });
  g += `</svg>`;
  return `<div class="slide">${hd(s)}<h1>${esc(s.title)}</h1><div class="body"><div class="fade" style="height:100%">${g}</div></div>${take(s)}${src(s)}</div>`;
};
B.roe = s => {
  const rows = s.rows.map((r, i) => `<div class="fade" style="display:grid;grid-template-columns:1fr 220px 220px;gap:20px;padding:20px 24px;border-bottom:1px solid var(--line);font-size:26px;transition-delay:${i*.1}s"><span>${esc(r[0])}</span><b>${rt(r[1])}</b><b style="color:${i < 2 ? 'var(--red)' : 'var(--ink)'}">${rt(r[2])}</b></div>`).join('');
  return `<div class="slide">${hd(s)}<h1>${esc(s.title)}</h1><div class="body"><div class="chartbox" style="padding:6px 0"><div style="display:grid;grid-template-columns:1fr 220px 220px;gap:20px;padding:14px 24px;color:var(--muted);font-size:18px"><span>المؤشر</span><span>${s.cols[0]}</span><span>${s.cols[1]}</span></div>${rows}</div></div>${take(s)}${src(s)}</div>`;
};

/* ——— البناء ——— */
const host = document.getElementById('slides');
host.innerHTML = ALL.map(s => B[s.kind](s)).join('');
const els = Array.from(host.children);
const TRK = ['المقدمة', 'البعد التسويقي', 'البعد الاستراتيجي', 'البعد المالي', 'الخاتمة'];
const SHORT = {'المقدمة':'المقدمة','البعد التسويقي':'التسويقي','البعد الاستراتيجي':'الاستراتيجي','البعد المالي':'المالي','الخاتمة':'الخاتمة'};
document.getElementById('trk').innerHTML = TRK.map((t, i) => `<span data-s="${t}">${SHORT[t]}</span>${i < TRK.length-1 ? '<em>‹</em>' : ''}`).join('');
const trk = Array.from(document.querySelectorAll('#trk span'));

function countUp(root){
  root.querySelectorAll('.cu').forEach(el => {
    const to = parseFloat(el.dataset.to), dec = parseInt(el.dataset.dec || '0'), t0 = performance.now(), dur = 1400;
    function step(t){ const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e, dec); if (k < 1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  });
}
function wordsIn(root){
  const ws = root.querySelectorAll('.problem .w'); ws.forEach(w => w.classList.remove('lit'));
  ws.forEach((w, i) => setTimeout(() => w.classList.add('lit'), 120 + i * 32));
}

let cur = 0, t0 = null, slideT0 = performance.now();
const num = document.getElementById('num'), prog = document.getElementById('prog');
function show(i){
  i = Math.max(0, Math.min(ALL.length - 1, i));
  els.forEach((e, k) => e.classList.toggle('on', k === i));
  cur = i; slideT0 = performance.now();
  if (i > 0 && t0 === null) t0 = performance.now();
  const s = ALL[i];
  num.textContent = s.backup ? 'احتياطي' : `${i + 1} / ${MAIN}`;
  const si = TRK.indexOf(s.sec);
  trk.forEach((t, k) => { t.classList.toggle('on', k === si); t.classList.toggle('done', si > -1 && k < si); });
  countUp(els[i]); if (s.kind === 'problem') wordsIn(els[i]);
  if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  renderNotes();
}
const notes = document.getElementById('notes');
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function renderNotes(){
  if (!notes.classList.contains('show')) return;
  const s = ALL[cur];
  const el = t0 === null ? 0 : (performance.now() - t0) / 1000, se = (performance.now() - slideT0) / 1000;
  notes.innerHTML = `<div class="h"><span>الشريحة ${cur + 1} · المخصص ${mmss(s.seconds || 0)} · مضى على الشريحة <span class="${se > (s.seconds || 999) ? 't1' : ''}">${mmss(se)}</span></span><span>الإجمالي <span class="${el > TOTAL ? 't1' : ''}">${mmss(el)}</span> / ${mmss(TOTAL)}</span></div>
    <div>${esc(s.talk || s.take || '').replace(/ · /g, ' <span style="color:var(--dim)">|</span> ')}</div>${s.next ? `<div class="nx">← ${esc(s.next)}</div>` : ''}`;
}
setInterval(() => { renderNotes(); const el = t0 === null ? 0 : (performance.now() - t0) / 1000; prog.style.width = Math.min(100, el / TOTAL * 100) + '%'; }, 500);

let typed = '';
document.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft','ArrowDown','PageDown',' ','Spacebar'].includes(k) || (k === 'Enter' && !typed)) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowRight','ArrowUp','PageUp','Backspace'].includes(k)) { e.preventDefault(); show(cur - 1); }
  else if (k === 'Home') show(0); else if (k === 'End') show(MAIN - 1);
  else if (/^[0-9]$/.test(k)) { typed += k; }
  else if (k === 'Enter' && typed) { show(parseInt(typed) - 1); typed = ''; }
  else if (k === 'n' || k === 'N' || k === 'ى') { notes.classList.toggle('show'); renderNotes(); }
  else if (k === 'b' || k === 'B' || k === '.' || k === 'لا') { const b = document.getElementById('black'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }
  else if (k === 'f' || k === 'F' || k === 'ب') { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
  else if (k === 'h' || k === 'H' || k === '?' || k === 'ا') document.getElementById('help').classList.toggle('show');
  else if (k === 'Escape') { document.getElementById('help').classList.remove('show'); notes.classList.remove('show'); }
});
document.getElementById('stage').addEventListener('click', e => { if (e.target.closest('#notes,#help')) return; show(cur + 1); });
let tx = null;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
document.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) show(cur + (dx > 0 ? 1 : -1)); tx = null; });

function fit(){ const s = Math.min(innerWidth / 1600, innerHeight / 900); document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

const h0 = parseInt((location.hash || '').slice(1));
show(isNaN(h0) ? 0 : h0 - 1);
window.__deck = {show, count: ALL.length, main: MAIN};
})();
</script>
</body>
</html>
